<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>해요코딩학원</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #07111f;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  .scene {
    position: relative;
    width: 100vw;

    /* 구형 브라우저 기본값 */
    height: 100vh;

    /* 아이폰 Safari 주소창/도구막대 변화 대응 */
    height: 100svh;
    min-height: 100dvh;

    overflow: hidden;
    background:
      radial-gradient(circle at 50% 85%, rgba(47, 61, 87, 0.40), transparent 32%),
      linear-gradient(to bottom, #07101d 0%, #111d35 58%, #30364a 100%);
  }

  .stars,
  .stars::before,
  .stars::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
    background-repeat: repeat;
  }

  .stars {
    opacity: .85;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.95) 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1.5px);
    background-size: 120px 120px, 180px 180px;
    background-position: 10px 20px, 75px 45px;
    animation: twinkle 5s ease-in-out infinite alternate;
  }

  .stars::before {
    background-image:
      radial-gradient(circle, rgba(255,238,190,.9) 1.2px, transparent 1.7px);
    background-size: 230px 230px;
    background-position: 120px 80px;
    opacity: .65;
  }

  .stars::after {
    background-image:
      radial-gradient(circle, rgba(255,255,255,.8) .8px, transparent 1.3px);
    background-size: 90px 90px;
    background-position: 40px 10px;
    opacity: .4;
  }

  @keyframes twinkle {
    from { opacity: .45; }
    to { opacity: .95; }
  }

  .title-box {
    position: absolute;
    top: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    width: min(92vw, 900px);
    text-align: center;
    color: #fff7df;
    text-shadow: 0 3px 18px rgba(0,0,0,.65);
    opacity: 0;
    animation: textIn 2s ease 2.5s forwards;
  }

  .title-box h1 {
    font-size: clamp(36px, 6vw, 78px);
    letter-spacing: .08em;
    font-weight: 700;
  }

  .title-box p {
    margin-top: 14px;
    font-size: clamp(15px, 2vw, 24px);
    color: #efe6cf;
    letter-spacing: .04em;
  }

  @keyframes textIn {
    from {
      opacity: 0;
      transform: translate(-50%, -12px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }

  .moon-wrap {
    position: absolute;
    left: 50%;
    bottom: -34vh;
    width: min(34vw, 360px);
    aspect-ratio: 1;
    transform: translateX(-50%);
    z-index: 3;
    animation: moonRise 8s cubic-bezier(.22,.7,.2,1) forwards;
  }

  @keyframes moonRise {
    0% {
      bottom: -34vh;
      transform: translateX(-50%) scale(.82);
    }
    72% {
      bottom: 29vh;
      transform: translateX(-50%) scale(1);
    }
    100% {
      bottom: 26vh;
      transform: translateX(-50%) scale(1);
    }
  }

  .moon-glow {
    position: absolute;
    inset: -36%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,231,157,.38) 0%,
      rgba(255,217,118,.20) 28%,
      rgba(255,217,118,.09) 48%,
      transparent 70%);
    filter: blur(8px);
    animation: glow 3.8s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { transform: scale(.96); opacity: .72; }
    to { transform: scale(1.07); opacity: 1; }
  }

  .moon {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 0 32px rgba(255,228,150,.8),
      0 0 85px rgba(255,216,115,.38),
      inset -24px -18px 40px rgba(166,114,57,.16);
    background:
      radial-gradient(circle at 29% 31%, rgba(199,151,82,.14) 0 6%, transparent 7%),
      radial-gradient(circle at 63% 27%, rgba(184,137,72,.10) 0 7%, transparent 8%),
      radial-gradient(circle at 66% 63%, rgba(166,116,61,.12) 0 10%, transparent 11%),
      radial-gradient(circle at 37% 73%, rgba(192,144,73,.10) 0 8%, transparent 9%),
      radial-gradient(circle at 50% 50%, #fff9d4 0%, #ffe99d 58%, #f7c862 100%);
  }

  .rabbit {
    position: absolute;
    left: 50%;
    bottom: 20%;
    width: 17%;
    height: 26%;
    transform: translateX(-50%);
    opacity: .18;
  }

  .rabbit .body {
    position: absolute;
    bottom: 0;
    left: 20%;
    width: 60%;
    height: 55%;
    background: #8f6c46;
    border-radius: 50% 50% 42% 42%;
  }

  .rabbit .head {
    position: absolute;
    left: 26%;
    top: 24%;
    width: 48%;
    height: 42%;
    background: #8f6c46;
    border-radius: 50%;
  }

  .rabbit .ear {
    position: absolute;
    top: 0;
    width: 19%;
    height: 44%;
    background: #8f6c46;
    border-radius: 50% 50% 42% 42%;
  }

  .rabbit .ear.e1 {
    left: 31%;
    transform: rotate(-10deg);
  }

  .rabbit .ear.e2 {
    right: 31%;
    transform: rotate(12deg);
  }

  .cloud {
    position: absolute;
    z-index: 4;
    height: 22px;
    border-radius: 100px;
    background: rgba(220,229,240,.10);
    filter: blur(.3px);
    animation: drift linear infinite;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: inherit;
  }

  .cloud::before {
    width: 70px;
    height: 45px;
    left: 26px;
    top: -20px;
  }

  .cloud::after {
    width: 90px;
    height: 54px;
    right: 30px;
    top: -28px;
  }

  .c1 {
    width: 230px;
    left: -260px;
    top: 33%;
    opacity: .7;
    animation-duration: 28s;
  }

  .c2 {
    width: 310px;
    left: -350px;
    top: 47%;
    opacity: .45;
    animation-duration: 40s;
    animation-delay: -12s;
  }

  .c3 {
    width: 180px;
    left: -220px;
    top: 22%;
    opacity: .36;
    animation-duration: 34s;
    animation-delay: -22s;
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 600px)); }
  }

  .mountains-back,
  .mountains-front {
    position: absolute;
    left: -5vw;
    width: 110vw;
    pointer-events: none;
  }

  .mountains-back {
    bottom: 9vh;
    height: 32vh;
    z-index: 2;
    background: #19283a;
    clip-path: polygon(
      0 75%, 8% 54%, 15% 67%, 25% 39%, 34% 69%,
      43% 50%, 52% 70%, 63% 35%, 72% 62%,
      82% 48%, 91% 67%, 100% 43%, 100% 100%, 0 100%
    );
    opacity: .95;
  }

  .mountains-front {
    bottom: 0;
    height: 28vh;
    z-index: 5;
    background: #0a131d;
    clip-path: polygon(
      0 70%, 9% 48%, 16% 64%, 25% 36%, 34% 58%,
      42% 43%, 50% 67%, 60% 41%, 70% 55%,
      80% 34%, 90% 60%, 100% 43%, 100% 100%, 0 100%
    );
  }

  .ground {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 12vh;
    z-index: 7;
    background:
      linear-gradient(to bottom, rgba(8,15,22,.3), #070d13 38%),
      #070d13;
  }

  .reeds {
    position: absolute;
    bottom: 5vh;
    left: 0;
    width: 100%;
    height: 22vh;
    z-index: 8;
    opacity: .86;
    pointer-events: none;
  }

  .reed {
    position: absolute;
    bottom: 0;
    width: 2px;
    height: var(--h);
    left: var(--x);
    background: linear-gradient(#9a7d49, #3b321f);
    transform-origin: bottom center;
    transform: rotate(var(--r));
    animation: sway 4s ease-in-out infinite alternate;
    animation-delay: var(--d);
  }

  .reed::after {
    content: "";
    position: absolute;
    top: -7px;
    left: -4px;
    width: 10px;
    height: 18px;
    border-radius: 70% 30% 70% 30%;
    background: #b9a06c;
    transform: rotate(18deg);
  }

  @keyframes sway {
    from { transform: rotate(calc(var(--r) - 2deg)); }
    to { transform: rotate(calc(var(--r) + 2deg)); }
  }

  .hint {
    position: absolute;
    right: max(22px, env(safe-area-inset-right));
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 20;
    font-size: 13px;
    color: rgba(255,255,255,.55);
    user-select: none;
  }

  .replay {
    position: absolute;
    left: 50%;
    bottom: calc(4.5vh + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 20;
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(6,12,20,.48);
    color: #f7edd7;
    padding: 11px 18px;
    border-radius: 999px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
    transition: .2s ease;
  }

  .replay:hover {
    background: rgba(255,255,255,.12);
    transform: translateX(-50%) translateY(-2px);
  }

  @media (max-width: 600px) {
    .moon-wrap {
      width: min(58vw, 300px);
    }

    .title-box {
      top: calc(7vh + env(safe-area-inset-top));
      width: 88vw;
    }

    .title-box h1 {
      font-size: clamp(34px, 12vw, 56px);
    }

    .title-box p {
      font-size: clamp(13px, 4vw, 18px);
      line-height: 1.55;
      padding: 0 8px;
    }

    .mountains-back {
      height: 30vh;
    }

    .mountains-front {
      height: 25vh;
    }

    .replay {
      bottom: calc(18px + env(safe-area-inset-bottom));
      font-size: 13px;
      padding: 10px 16px;
    }

    .hint {
      display: none;
    }
  }

  /* 가로모드 아이폰 대응 */
  @media (max-height: 500px) and (orientation: landscape) {
    .title-box {
      top: calc(3vh + env(safe-area-inset-top));
    }

    .title-box h1 {
      font-size: clamp(28px, 6vw, 42px);
    }

    .title-box p {
      margin-top: 6px;
      font-size: 13px;
    }

    .moon-wrap {
      width: min(27vw, 220px);
    }

    .replay {
      bottom: calc(10px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars"></div>

    <section class="title-box">
      <h1>해요코딩학원</h1>
      <p>풍성하고 따뜻한 보름달처럼 행복이 가득하길 바랍니다.</p>
    </section>

    <div class="moon-wrap" id="moonWrap">
      <div class="moon-glow"></div>
      <div class="moon">
        <div class="rabbit">
          <div class="ear e1"></div>
          <div class="ear e2"></div>
          <div class="head"></div>
          <div class="body"></div>
        </div>
      </div>
    </div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountains-back"></div>
    <div class="mountains-front"></div>
    <div class="ground"></div>

    <div class="reeds" id="reeds"></div>

    <button class="replay" id="replayBtn">보름달 다시 띄우기</button>
    <div class="hint">화면을 클릭하면 별빛이 반짝입니다.</div>
  </main>

<script>
  const reeds = document.getElementById("reeds");

  for (let i = 0; i < 46; i++) {
    const reed = document.createElement("span");
    reed.className = "reed";

    reed.style.setProperty("--x", (Math.random() * 100) + "%");
    reed.style.setProperty("--h", (55 + Math.random() * 100) + "px");
    reed.style.setProperty("--r", (-8 + Math.random() * 16) + "deg");
    reed.style.setProperty("--d", (-Math.random() * 4) + "s");

    reeds.appendChild(reed);
  }

  const replayBtn = document.getElementById("replayBtn");
  const moonWrap = document.getElementById("moonWrap");
  const titleBox = document.querySelector(".title-box");

  replayBtn.addEventListener("click", () => {
    moonWrap.style.animation = "none";
    titleBox.style.animation = "none";

    void moonWrap.offsetWidth;
    void titleBox.offsetWidth;

    moonWrap.style.animation = "";
    titleBox.style.animation = "";
  });

  document.getElementById("scene").addEventListener("pointerdown", (e) => {
    if (e.target === replayBtn) return;

    for (let i = 0; i < 9; i++) {
      const sparkle = document.createElement("span");
      sparkle.style.position = "absolute";
      sparkle.style.left = (e.clientX + (Math.random() - 0.5) * 90) + "px";
      sparkle.style.top = (e.clientY + (Math.random() - 0.5) * 90) + "px";
      sparkle.style.width = sparkle.style.height = (2 + Math.random() * 4) + "px";
      sparkle.style.borderRadius = "50%";
      sparkle.style.background = "#fff7cf";
      sparkle.style.boxShadow = "0 0 12px #ffe9a3";
      sparkle.style.zIndex = "30";
      sparkle.style.pointerEvents = "none";
      sparkle.style.transition = "all 1s ease";
      document.body.appendChild(sparkle);

      requestAnimationFrame(() => {
        sparkle.style.transform = `translate(${(Math.random() - .5) * 60}px, ${(Math.random() - .5) * 60}px) scale(.2)`;
        sparkle.style.opacity = "0";
      });

      setTimeout(() => sparkle.remove(), 1050);
    }
  });
</script>
</body>
</html>
